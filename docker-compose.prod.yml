name: shelf-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: shelf-postgres-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_prod_secret
      POSTGRES_DB: shelf_prod_db
    ports:
      - "5433:5432"
    volumes:
      - shelf_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shelf_prod_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shelf-api-prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres_prod_secret
      DB_DATABASE: shelf_prod_db
      DB_SYNCHRONIZE: "false"
      CORS_ORIGIN: "*"
      SWAGGER_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

volumes:
  shelf_pgdata_prod:
